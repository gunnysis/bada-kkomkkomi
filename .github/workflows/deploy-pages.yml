name: Deploy 바다꼼꼬미 PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate static config & spatial GeoJSON integrity
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const cfg = JSON.parse(fs.readFileSync('public/config/app_config.json', 'utf8'));
            if (!Array.isArray(cfg.layers)) throw new Error('Invalid app_config.json: layers must be an array');
            const layersDir = 'public/data/layers';
            for (const file of fs.readdirSync(layersDir)) {
              if (file.endsWith('.geojson') || file.endsWith('.json')) {
                const fc = JSON.parse(fs.readFileSync(path.join(layersDir, file), 'utf8'));
                if (fc.type !== 'FeatureCollection' || !Array.isArray(fc.features)) {
                  throw new Error('Invalid GeoJSON FeatureCollection: ' + file);
                }
              }
            }
            console.log('Verified app_config.json and spatial layer files.');
          "

      - name: Lint & Build PWA (with GitHub Pages base path)
        env:
          GITHUB_ACTIONS: 'true'
          KAKAO_MAP_API_KEY: ${{ secrets.KAKAO_MAP_API_KEY }}
        run: |
          npm run lint
          npm run build
          rm -rf dist/dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
