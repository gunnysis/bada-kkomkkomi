name: Deploy 바다꼼꼬미 PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate static config, version parity, docking GeoJSON & ports dataset integrity
        run: npm run verify

      - name: Lint, Run Automated Unit Tests, Build PWA & Post-Build SW Integrity Check
        env:
          GITHUB_ACTIONS: 'true'
          KAKAO_MAP_API_KEY: ${{ secrets.KAKAO_MAP_API_KEY }}
        run: |
          npm run lint
          npm test
          npm run build
          npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
